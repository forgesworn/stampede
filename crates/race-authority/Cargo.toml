[package]
name = "race-authority"
description = "Stampede's import-free Fray game authority component."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
race-session = { path = "../race-session", default-features = false, features = ["authority"] }
fray-session = { path = "../../../forgesworn/fray/crates/fray-session", default-features = false, features = ["authority"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "=0.62.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = { version = "1", optional = true }
wasmtime = { version = "=50.0.0", default-features = false, features = ["anyhow", "std", "runtime", "cranelift", "component-model"], optional = true }
wit-component = { version = "=0.261.0", optional = true }
wasmparser = { version = "=0.261.0", optional = true }
race-core = { path = "../race-core", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
bincode = { version = "1.3", optional = true }
decented-net = { package = "fray-net", path = "../../../forgesworn/fray/crates/decented-net", optional = true }

[features]
qualification = ["race-session/native", "dep:anyhow", "dep:wasmtime", "dep:wit-component", "dep:wasmparser", "dep:race-core", "dep:serde", "dep:serde_json", "dep:bincode", "dep:decented-net"]

[[test]]
name = "component"
required-features = ["qualification"]

[[example]]
name = "profile_setup"
required-features = ["qualification"]
