[package]
name = "race-core"
description = "Stampede's pure race sim: tracks, ostrich physics, items, coins, targets, lasers, race rules, bots, training."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
rand = { version = "0.8", default-features = false }
rand_pcg = "0.3"
# Ghost files (Time Trial): compact, versioned.
bincode = "1.3"

[dev-dependencies]
serde_json = "1"
