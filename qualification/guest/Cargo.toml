[package]
name = "race-authority"
description = "Public, isolated build of Stampede's existing authority guest."
version = "0.4.14"
edition = "2021"
license = "MIT"

[workspace]
resolver = "2"

[lib]
path = "../../crates/race-authority/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
race-session = { path = "../../crates/race-session", default-features = false, features = ["authority"] }
fray-session = { path = "../../../forgesworn/fray/crates/fray-session", default-features = false, features = ["authority"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "=0.62.0"

[profile.dev]
debug = 0
opt-level = 1
incremental = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
